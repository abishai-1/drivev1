<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drive Folio</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="intro" class="intro">
      <h1>Hi, I'm <span>Your Name</span></h1>
      <p>Hop in and drive around to explore.</p>
      <div class="keys">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows to drive</div>
        <div><kbd>Space</kbd> brake · <kbd>Shift</kbd> boost · <kbd>R</kbd> reset</div>
      </div>
      <button id="start">Start engine</button>
    </div>

    <aside id="panel" class="panel">
      <h2 id="panel-title"></h2>
      <div id="panel-body"></div>
    </aside>

    <div id="touch" class="touch">
      <button data-key="left">◀</button>
      <button data-key="right">▶</button>
      <span class="spacer"></span>
      <button data-key="back">▼</button>
      <button data-key="forward">▲</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
